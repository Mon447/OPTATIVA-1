<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login POS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #5a1d3c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card-container {
            width: 750px;
            height: 450px;
            background-color: #ffffff;
            border-radius: 15px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* PANEL IZQUIERDO */
        .left-panel {
            width: 35%;
            background: linear-gradient(135deg, #a8326a 0%, #7d2250 100%);
            position: relative;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .left-tab {
            background-color: #ffffff;
            padding: 12px 28px 12px 22px;
            border-top-left-radius: 25px;
            border-bottom-left-radius: 25px;
            color: #7d2250;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: -3px 3px 10px rgba(0,0,0,0.15);
            z-index: 2;
        }

        /* PANEL DERECHO */
        .right-panel {
            width: 65%;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .avatar-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #a8326a, #7d2250);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(125, 34, 80, 0.3);
        }

        .avatar-circle svg {
            width: 36px;
            height: 36px;
            fill: #ffffff;
        }

        .right-panel h2 {
            color: #7d2250;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .login-form {
            width: 100%;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            border-bottom: 1px solid #cccccc;
            display: flex;
            align-items: center;
        }

        .input-group svg {
            width: 20px;
            height: 20px;
            fill: #777777;
            margin-right: 12px;
        }

        .input-group input {
            width: 100%;
            border: none;
            outline: none;
            padding: 10px 0;
            font-size: 14px;
            color: #333333;
        }

        .input-group input::placeholder {
            color: #aaaaaa;
        }

        .error-message {
            color: #d9534f;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .btn-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-submit {
            background-color: #a8326a;
            color: #ffffff;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 4px 10px rgba(168, 50, 106, 0.3);
        }

        .btn-submit:hover {
            background-color: #7d2250;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Panel Izquierdo -->
        <div class="left-panel">
            <div class="left-tab">INICIO</div>
        </div>

        <!-- Panel Derecho -->
        <div class="right-panel">
            <div class="avatar-circle">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <h2>INICIAR SESIÓN</h2>

            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <form class="login-form" method="POST" autocomplete="off">
                <div class="input-group">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <input type="text" name="username" placeholder="USUARIO" required autocomplete="off">
                </div>

                <div class="input-group">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                    <input type="password" name="password" placeholder="CONTRASEÑA" required autocomplete="new-password">
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-submit">ACCEDER</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
